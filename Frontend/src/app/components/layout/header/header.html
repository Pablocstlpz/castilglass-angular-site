<!-- Top utility bar (oculto en mobile) -->
<div
  class="hidden md:block w-full bg-ink-900 text-ink-100 text-xs"
  aria-label="Información de contacto"
>
  <div class="max-w-7xl mx-auto px-4 md:px-8 flex items-center justify-between h-9">
    <div class="flex items-center gap-6">
      <span class="flex items-center gap-2 text-ink-200">
        <span class="material-symbols-outlined text-[14px] text-brand-400">schedule</span>
        Lun – Vie · 8:00 – 18:00
      </span>
      <span class="hidden lg:flex items-center gap-2 text-ink-200">
        <span class="material-symbols-outlined text-[14px] text-brand-400">location_on</span>
        Polígono Las Quemadas, Córdoba
      </span>
    </div>
    <div class="flex items-center gap-5">
      <a
        class="flex items-center gap-2 text-ink-100 hover:text-white transition-colors"
        href="tel:+34600952601"
      >
        <span class="material-symbols-outlined text-[14px] text-brand-400">call</span>
        +34 600 952 601
      </a>
      <a
        class="hidden lg:flex items-center gap-2 text-ink-100 hover:text-white transition-colors"
        href="mailto:castilglass@hotmail.com"
      >
        <span class="material-symbols-outlined text-[14px] text-brand-400">mail</span>
        castilglass&#64;hotmail.com
      </a>
    </div>
  </div>
</div>

<!-- Main navigation -->
<nav
  class="sticky top-0 w-full z-50 bg-white/85 glass-nav border-b border-ink-200/60"
  aria-label="Navegación principal"
>
  <div class="flex justify-between items-center px-4 md:px-8 py-3 md:py-4 max-w-7xl mx-auto">
    <a
      class="flex items-center gap-3 cursor-pointer group"
      routerLink="/"
      aria-label="Castilglass — Inicio"
    >
      <img
        src="images/Logo-Castilglass.png"
        alt="Castilglass"
        class="h-14 md:h-16 w-auto transition-transform group-hover:scale-[1.02]"
      />
    </a>

    <!-- Desktop nav -->
    <div class="hidden md:flex items-center gap-7 lg:gap-9">
      <button
        type="button"
        class="nav-link"
        [class.nav-link-active]="activeSection() === 'inicio'"
        (click)="scrollToSection('inicio')"
      >
        Inicio
      </button>
      <button
        type="button"
        class="nav-link"
        [class.nav-link-active]="activeSection() === 'servicios'"
        (click)="scrollToSection('servicios')"
      >
        Servicios
      </button>
      <button
        type="button"
        class="nav-link"
        [class.nav-link-active]="activeSection() === 'nosotros'"
        (click)="scrollToSection('nosotros')"
      >
        Sobre nosotros
      </button>
      <button
        type="button"
        class="nav-link"
        [class.nav-link-active]="activeSection() === 'contacto'"
        (click)="scrollToSection('contacto')"
      >
        Contacto
      </button>
    </div>

    <div class="flex items-center gap-3 md:gap-5">
      <button
        type="button"
        class="hidden md:inline-flex items-center gap-2 bg-brand-700 text-white px-5 py-2.5 rounded-lg font-semibold text-sm hover:bg-brand-800 active:scale-[0.98] transition-all shadow-soft"
        (click)="goToSolicitarPresupuesto()"
      >
        Solicitar presupuesto
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </button>

      <!-- Mobile menu button -->
      <label
        class="md:hidden flex items-center cursor-pointer p-1 text-ink-900"
        for="mobile-menu-toggle"
        aria-label="Abrir menú"
      >
        <span class="material-symbols-outlined text-3xl">menu</span>
      </label>
    </div>
  </div>

  <!-- Mobile menu -->
  <input class="hidden peer" id="mobile-menu-toggle" type="checkbox" />
  <div
    class="hidden peer-checked:flex flex-col absolute top-full left-0 w-full bg-white border-t border-ink-200 p-6 space-y-3 shadow-lift md:hidden"
    id="mobile-menu"
  >
    <button
      type="button"
      class="nav-link nav-link-mobile"
      [class.nav-link-active]="activeSection() === 'inicio'"
      (click)="scrollToSection('inicio')"
    >
      Inicio
    </button>
    <button
      type="button"
      class="nav-link nav-link-mobile"
      [class.nav-link-active]="activeSection() === 'servicios'"
      (click)="scrollToSection('servicios')"
    >
      Servicios
    </button>
    <button
      type="button"
      class="nav-link nav-link-mobile"
      [class.nav-link-active]="activeSection() === 'nosotros'"
      (click)="scrollToSection('nosotros')"
    >
      Sobre nosotros
    </button>
    <button
      type="button"
      class="nav-link nav-link-mobile"
      [class.nav-link-active]="activeSection() === 'contacto'"
      (click)="scrollToSection('contacto')"
    >
      Contacto
    </button>
    <div class="pt-4 mt-2 border-t border-ink-200 flex flex-col gap-3">
      <a
        class="flex items-center gap-2 text-ink-700 font-medium"
        href="tel:+34600952601"
      >
        <span class="material-symbols-outlined text-[18px] text-brand-700">call</span>
        +34 600 952 601
      </a>
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 bg-brand-700 text-white px-5 py-3 rounded-lg font-semibold text-sm"
        (click)="goToSolicitarPresupuesto()"
      >
        Solicitar presupuesto
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </button>
    </div>
  </div>
</nav>
